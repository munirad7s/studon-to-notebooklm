<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>StudOn → NotebookLM</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h7.5a1.5 1.5 0 0 1 1.5 1.5v9.5H4.5A1.5 1.5 0 0 1 3 12V2.5z"/><path d="M3 12a1.5 1.5 0 0 1 1.5-1.5H12"/><path d="M6 5.5h3.5M6 8h3.5"/></svg> StudOn → NotebookLM</div>
    <a href="../options/options.html" target="_blank" class="muted small">Optionen</a>
  </header>

  <section class="card" id="current">
    <div class="label">AKTUELLE SEITE</div>
    <div class="title" id="cur-title">…</div>
    <div class="muted small" id="cur-meta"></div>
    <button class="primary" id="btn-open" disabled>Exporter öffnen</button>
  </section>

  <section class="card">
    <form id="fautv-form">
      <label class="label" for="fautv-url">FAU.TV-LINK HINZUFÜGEN</label>
      <input id="fautv-url" type="url" required placeholder="https://www.fau.tv/series/…" aria-describedby="fautv-help launch-error">
      <div id="fautv-help" class="muted small">Ein Video oder eine ganze Vorlesungsreihe.</div>
      <button type="submit" class="primary">Im Exporter öffnen</button>
    </form>
  </section>
  <div id="launch-error" role="alert"></div>

  <section class="card" id="recent-card" hidden>
    <div class="label">ZULETZT EXPORTIERT</div>
    <ul id="recent" class="recent"></ul>
  </section>

  <footer class="foot muted small">
    <a href="https://notebooklm.google.com/" target="_blank">NotebookLM öffnen</a> ·
    <a href="https://www.studon.fau.de/studon/ilias.php?baseClass=ilMembershipOverviewGUI" target="_blank">Meine Kurse</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
